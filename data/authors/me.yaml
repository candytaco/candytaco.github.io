bio: |
  I am a Postdoctoral Scholar in the Gallant Lab in the Department of Neuroscience, University of California, Berkeley.
  I study the cognitive and neural basis of complex, naturalistic human behavior by combining interactive neuroimaging experiments built in modern game engines with high-dimensional computational models of brain activity.


